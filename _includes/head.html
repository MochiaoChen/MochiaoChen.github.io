<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% assign meta_title = page.title | default: site.title %}
{% assign meta_description = page.description | default: site.description | strip_html | strip_newlines %}
<title>{% if page.url == '/' or page.url == '/en/' %}{{ site.title }}{% else %}{{ meta_title }} · {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ meta_description | escape }}">
<meta name="theme-color" content="#f3efe7">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ meta_title | escape }}">
<meta property="og:description" content="{{ meta_description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta name="twitter:card" content="summary">
<script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('mochiao-theme');if(t){document.documentElement.dataset.theme=t}else if(window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.dataset.theme='dark'}}catch(e){}</script>
<link rel="preconnect" href="https://fontsapi.zeoseven.com" crossorigin>
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/309/main/result.css">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
