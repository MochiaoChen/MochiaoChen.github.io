locale: "zh-CN"
lang: "zh-CN"
title: "Mochiao Chen"
description: "金融、计算与写作。Mochiao Chen 的个人主页、博客与独立工具集。"
url: "https://mochiaochen.github.io"
baseurl: ""
repository: "MochiaoChen/MochiaoChen.github.io"
timezone: "Asia/Shanghai"

author:
  name: "Mochiao Chen"
  handle: "MochiaoChen"
  bio: "Finance x Computing x Writing"
  location: "Beijing, China"
  github: "https://github.com/MochiaoChen"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  parse_block_html: true
  footnote_nr: 1
  toc_levels: 2..4

permalink: /writing/:year/:month/:title/
paginate_path: /blog/page:num/

collections:
  pages:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
