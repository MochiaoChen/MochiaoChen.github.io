<!doctype html>
<html lang="{{ page.lang | default: 'zh-CN' }}">
  <head>{% include head.html %}</head>
  <body class="{{ page.body_class }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main">{{ content }}</main>
    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% if page.math %}
      <script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']]},svg:{fontCache:'global'}};</script>
      <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" defer></script>
    {% endif %}
    {% if page.mermaid %}
      <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        document.querySelectorAll('code.language-mermaid').forEach((code) => {
          const pre = code.parentElement;
          const graph = document.createElement('div');
          graph.className = 'mermaid'; graph.textContent = code.textContent; pre.replaceWith(graph);
        });
        mermaid.initialize({startOnLoad:true,theme:document.documentElement.dataset.theme==='dark'?'dark':'neutral'});
      </script>
    {% endif %}
  </body>
</html>
